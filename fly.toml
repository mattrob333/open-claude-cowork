# Fly.io Configuration for Open Claude Cowork
# Deploy with: fly launch --config fly.toml

app = "open-claude-cowork"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    port = 3001
    timeout = "10s"
    type = "http"

# Secrets to set via CLI:
# fly secrets set ANTHROPIC_API_KEY=sk-ant-...
# fly secrets set COMPOSIO_API_KEY=...
# fly secrets set CORS_ORIGINS=https://your-domain.fly.dev
